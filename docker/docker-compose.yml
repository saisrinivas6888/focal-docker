version: "3"
services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: Focalboard-manager
    volumes:
      - fbdata:/opt/focalboard/data
    ports:
      - "7001:7000"  # export
    environment:
      - VIRTUAL_HOST=focalboard.local
      - VIRTUAL_PORT=7001

volumes:
  fbdata:
