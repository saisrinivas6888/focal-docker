global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'focalboard-app'
    static_configs:
      - targets: ['Focalboard-manager:7000']  # ← Updated to match your app's port
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['docker_node-exporter_1:9100']
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

